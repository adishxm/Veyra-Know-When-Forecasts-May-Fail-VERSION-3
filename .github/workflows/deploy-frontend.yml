name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main  # Change to your default branch (e.g. master)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json' # Adjust path if in root

      - name: Install dependencies
        working-directory: ./frontend # Change to '.' if frontend is at root
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend # Change to '.' if frontend is at root
        env:
          # Pass your Render backend URL into the build step
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://veyra-know-when-forecasts-may-fail.onrender.com' }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_URL || 'https://veyra-know-when-forecasts-may-fail.onrender.com' }}
          VITE_BASE_PATH: '/Veyra-Know-When-Forecasts-May-Fail-VERSION-3/'
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Point to your build output folder (e.g., ./frontend/dist or ./frontend/build)
          path: './frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
